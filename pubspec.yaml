name: tabalah_admin
description: "Tabalah Club — لوحة تحكم النادي الرياضي"
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.8.1

# Only what the panel actually uses — the reference project's
# printing, excel, camera and charting packages are not pulled in.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_bloc: ^9.1.1
  intl: ^0.20.2
  window_manager: ^0.5.1
  custom_mouse_cursor: ^1.1.3
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.0.0
  font_awesome_flutter: ^10.9.1
  cached_network_image: ^3.4.1
  # Native "choose a file" dialog for sport and membership artwork. Desktop
  # support is built in, so no platform channel of our own is needed.
  file_picker: ^10.3.3
  # Hands the guardian code to a parent over WhatsApp or email, rather than
  # leaving the front desk to retype it into whichever app they are using.
  url_launcher: ^6.3.1
  # OSM tiles via flutter_map: google_maps_flutter has no Windows support,
  # and this is pure Dart + network tiles so the desktop build stays plain.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # Auto-update: read our own version, and put the downloaded installer
  # somewhere Windows will let us execute it.
  package_info_plus: ^8.1.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
